name: Build and publish LabX image

# Triggers on version tags like v1.0.0, v1.1.0, v2.0.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:   # allows manual trigger from the Actions tab too

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-org/labx

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-cuda
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Notes:
# - GITHUB_TOKEN already has permission to push to GHCR for this repo as long
#   as the "packages: write" permission above is set — no extra PAT needed.
# - GitHub Actions' free-tier runners have no GPU and can't *test* CUDA, only
#   build the image layers. GPU functionality should be smoke-tested manually
#   on a machine with an NVIDIA GPU after pulling the built image.
# - Free GitHub-hosted runners are also resource-limited (14GB disk, 7GB RAM);
#   an image this large (PyTorch + TensorFlow + CUDA libs) may need
#   "runs-on: ubuntu-latest" replaced with a larger runner, or self-hosted,
#   if the build starts failing on disk/memory rather than an actual error.
